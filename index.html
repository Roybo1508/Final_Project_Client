<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCloud</title>
  <link rel="stylesheet" href="style/main.css">
  <link rel="stylesheet" href="style/sidebar.css">
  <link rel="stylesheet" href="style/content.css">
  <link rel="stylesheet" href="style/modal.css">
  <link rel="stylesheet" href="style/admin.css">
</head>
<body>

  <div class="auth-screen" id="authScreen" hidden>
    <div class="auth-card">
      <div class="auth-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        </svg>
        <span>MyCloud</span>
      </div>
      <p class="auth-subtitle">Your personal cloud storage</p>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="loginTab" role="tab">Log In</button>
        <button class="auth-tab" id="registerTab" role="tab">Register</button>
      </div>

      <form class="auth-form" id="authForm">
        <div class="auth-field">
          <label for="authUsername">Username</label>
          <input type="text" id="authUsername" autocomplete="username" placeholder="Your username">
        </div>
        <div class="auth-field">
          <label for="authPassword">Password</label>
          <input type="password" id="authPassword" autocomplete="current-password" placeholder="At least 6 characters">
        </div>
        <p class="auth-message" id="authMessage" role="alert" hidden></p>
        <button type="submit" class="auth-submit" id="authSubmit">Log In</button>
      </form>
    </div>
  </div>

  <div class="app-shell" id="appShell" hidden>

    <aside class="sidebar" id="sidebar">

      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
        </svg>
        <span>MyCloud</span>
      </div>

      <nav class="sidebar-nav" id="mainNav" aria-label="Main navigation">
        <a class="nav-item" data-view="home" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a class="nav-item active" data-view="my-files" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          My Files
        </a>
        <a class="nav-item" data-view="photos" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Photos
        </a>
        <a class="nav-item" data-view="recent" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Recent
        </a>
      </nav>

      <div class="sidebar-admin-section" id="adminSection" aria-label="Server management navigation">
        <span class="section-label">Server Management</span>
        <a class="nav-item" data-view="server-dashboard" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Server Dashboard
        </a>
        <a class="nav-item" data-view="user-management" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          User Management
        </a>
        <a class="nav-item" data-view="all-files" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          All Files
        </a>
        <a class="nav-item" data-view="storage-backup" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          Storage &amp; Backup
        </a>
        <a class="nav-item" data-view="security-logs" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Security &amp; Logs
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="simulate-role" id="simulateRole" hidden>
          <span class="section-label">Admin Access</span>
          <div class="role-toggle" role="group" aria-label="View selector">
            <button class="role-btn active" id="userRoleBtn">User UI</button>
            <button class="role-btn" id="adminRoleBtn">Admin Panel</button>
          </div>
        </div>
        <div class="user-profile">
          <div class="user-avatar-sm" id="sidebarAvatar" aria-hidden="true">D</div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">David</span>
            <span class="user-role-label" id="sidebarUserRole">Standard User</span>
          </div>
          <button class="logout-btn" id="logoutBtn" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>

    </aside>

    <div class="main-area">

      <header class="topbar">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search files..." aria-label="Search files">
        </div>
        <div class="topbar-avatar" id="topbarAvatar" aria-hidden="true">D</div>
      </header>

      <main class="content" id="mainContent" aria-live="polite">
      </main>

      <footer class="status-bar" id="statusBar" aria-label="Storage and connection status">
        <div class="storage-info">
          <span class="storage-label">Storage Used</span>
          <div class="storage-bar" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Storage usage">
            <div class="storage-fill"></div>
          </div>
          <span class="storage-text">450GB / 1TB</span>
        </div>
        <div class="connection-info">
          <span class="connection-dot" aria-hidden="true"></span>
          Connection: Secure (TLS 1.3)
        </div>
      </footer>

    </div>
  </div>

  <div class="modal-overlay" id="authModalOverlay" role="dialog" aria-modal="true">
    <div class="modal"></div>
  </div>

  <div class="modal-overlay" id="shareModalOverlay" role="dialog" aria-modal="true" hidden>
    <div class="modal-content" id="shareModalContent">
      <div class="modal-header">
        <h3>Share File</h3>
        <button class="modal-close" id="shareModalClose" aria-label="Close share modal">×</button>
      </div>
      <form id="shareForm">
        <div class="form-group">
          <label>File:</label>
          <div class="file-name-display" id="shareFileName"></div>
        </div>
        <div class="form-group">
          <label for="shareEmail">Recipient Email *</label>
          <input type="email" id="shareEmail" required placeholder="recipient@example.com">
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="sharePasswordCheckbox">
            Protect with password
          </label>
          <input type="password" id="sharePasswordInput" placeholder="Optional password" hidden>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="shareExpirationCheckbox">
            Set expiration
          </label>
          <select id="shareExpirationDays" hidden>
            <option value="1">1 day</option>
            <option value="7">7 days</option>
            <option value="30">30 days</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Share</button>
          <button type="button" id="shareCancel" class="btn btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <input type="file" id="fileUploadInput" hidden>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/modal.js"></script>
  <script src="js/fileGrid.js"></script>
  <script src="js/adminViews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
